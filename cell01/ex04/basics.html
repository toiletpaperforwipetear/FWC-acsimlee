<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
        }
        h1 {
            color: white;
            text-align: center;
        }
        .shops-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            text-align: center;
        }
        .shop-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .footer {
            text-align: right;
            font-style: italic;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>-so bigger!-</h1>

    <div class="shops-container">
        <div class="shop-item">
            <img src="https://inwfile.com/s-cw/azy106.png" alt="Shopee" width="200">
            <a href="https://shopee.co.th/">Shopee</a>
        </div>
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg" alt="eBay" width="200">
            <a href="https://www.ebay.com">eBay</a>
        </div>
    </div>

    <hr>

    <div class="footer">
        &copy; login 2026
    </div>

</body>
</html>
