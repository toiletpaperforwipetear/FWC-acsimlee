<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid black;
        }
        td {
            width: 50%;
            height: 150px;
            padding: 20px;
            border: 1px solid black;
            font-family: sans-serif;
            font-size: 18px;
            vertical-align: middle;
        }
        .first-cell {
            background-color: #b7c675;
        }
        .second-cell {
            background-color: #f6c0b3;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="first-cell">First cell</td>
            <td class="second-cell">Second cell</td>
        </tr>
    </table>

</body>
</html>
